<div class="login-page">
  <div class="card login-card shadow-sm border-0">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="brand-icon mb-2"><i class="las la-file-alt"></i></div>
        <h1 class="h5 fw-bold mb-1">Server Log Viewer</h1>
        <p class="text-muted small mb-0">Sign in with your assessment admin account</p>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold" id="env-label">Environment</label>
        <div class="btn-group w-100" role="group" aria-labelledby="env-label">
          @for (e of environments; track e.key) {
            <button type="button" class="btn btn-sm"
                    [class.btn-primary]="env.env().key === e.key"
                    [class.btn-outline-primary]="env.env().key !== e.key"
                    [attr.aria-pressed]="env.env().key === e.key"
                    (click)="selectEnv(e.key)">{{ e.label }}</button>
          }
        </div>
        <div class="form-text text-truncate" [title]="env.baseUrl()">{{ env.baseUrl() }}</div>
      </div>

      @if (expired && !error()) {
        <div class="alert alert-warning py-2 small" role="status">Your session has ended. Please sign in again.</div>
      }
      @if (error()) {
        <div class="alert alert-danger py-2 small" role="alert">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold">Email address</label>
          <input id="email" type="email" class="form-control" formControlName="emailAddress"
                 autocomplete="username" autofocus
                 [class.is-invalid]="form.controls.emailAddress.touched && form.controls.emailAddress.invalid">
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label small fw-semibold">Password</label>
          <div class="input-group has-validation">
            <input id="password" class="form-control" formControlName="userPassword"
                   [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password"
                   [class.is-invalid]="form.controls.userPassword.touched && form.controls.userPassword.invalid">
            <button type="button" class="btn btn-outline-secondary" (click)="showPassword.set(!showPassword())"
                    [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
              <i class="las" [class.la-eye]="!showPassword()" [class.la-eye-slash]="showPassword()"></i>
            </button>
            <div class="invalid-feedback">Enter your password.</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
          @if (submitting()) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Signing in…
          } @else {
            Sign in to {{ env.env().label }}
          }
        </button>
      </form>
    </div>
  </div>
</div>
